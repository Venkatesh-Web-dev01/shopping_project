<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanCart</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }
      .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 20px 40px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 18px 22px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f46e5, #0ea5e9);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
      }
      .brand-text {
        font-size: 1.7rem;
        font-weight: 700;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .search-bar {
        padding: 10px 16px;
        border: 1px solid #d1d5db;
        border-radius: 999px;
        min-width: 280px;
        background: #f9fafb;
      }
      .mini-label {
        margin: 0;
        color: #6366f1;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .hero {
        background: linear-gradient(135deg, #111827, #1f2937);
        color: #fff;
        padding: 32px 28px;
        border-radius: 20px;
        margin: 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hero h2 { margin: 0 0 8px; font-size: 2.4rem; }
      .hero p { margin: 0; color: #d1d5db; }
      .hero-badge {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      .section-title {
        margin: 18px 0 14px;
        font-size: 1.6rem;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }
      .product-card {
        background: white;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }
      .product-image {
        height: 140px;
        border-radius: 14px;
        background: linear-gradient(135deg, #dbeafe, #e0e7ff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        margin-bottom: 12px;
      }
      .product-tag {
        display: inline-block;
        background: #e0e7ff;
        color: #3730a3;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }
      .product-card h3 {
        margin: 16px 0 8px;
        font-size: 1.4rem;
      }
      .price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 8px 0;
      }
      .price {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0;
      }
      .rating, .stock {
        color: #4b5563;
        margin: 6px 0;
      }
      .qty-box {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0 12px;
      }
      .qty-box button, .cart-btn, .add-btn {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .qty-box button, .cart-btn {
        background: #dbeafe;
        color: #1d4ed8;
        padding: 8px 12px;
      }
      .qty-box span {
        min-width: 24px;
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .add-btn {
        width: 100%;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 12px;
      }
      .cart-btn {
        background: #111827;
        color: white;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div class="brand-box">
          <div class="logo">U</div>
          <div>
            <p class="mini-label">Shop Now</p>
            <div class="brand-text">UrbanCart</div>
          </div>
        </div>

        <div class="nav-actions">
          <input class="search-bar" type="text" value="Search products" aria-label="Search products" />
          <button class="cart-btn" id="cartBtn">Cart (0)</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <h2>Trending Products</h2>
          <p>Fresh deals for your everyday shopping.</p>
        </div>
        <div class="hero-badge">Free delivery over ₹999</div>
      </section>

      <h3 class="section-title">Featured Items</h3>
      <section class="product-grid" id="productGrid"></section>
    </main>

    <script>
      const products = [
        {
          name: 'Wireless Earbuds',
          price: 2499,
          category: 'Electronics',
          rating: 4.8,
          stock: 12,
          icon: '🎧'
        },
        {
          name: 'Running Shoes',
          price: 3299,
          category: 'Fashion',
          rating: 4.7,
          stock: 8,
          icon: '👟'
        },
        {
          name: 'Smart Watch',
          price: 4999,
          category: 'Accessories',
          rating: 4.9,
          stock: 5,
          icon: '⌚'
        }
      ];

      let cartCount = 0;

      function createProductCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card';

        const quantity = 1;

        card.innerHTML = `
          <div class="product-image">${product.icon}</div>
          <div class="product-tag">${product.category}</div>
          <h3>${product.name}</h3>
          <div class="price-row">
            <p class="price">₹${product.price}</p>
          </div>
          <p class="rating">⭐ ${product.rating}</p>
          <p class="stock">${product.stock > 0 ? product.stock + ' in stock' : 'Out of stock'}</p>
          <div class="qty-box">
            <button type="button" data-action="minus">-</button>
            <span>${quantity}</span>
            <button type="button" data-action="plus">+</button>
          </div>
          <button class="add-btn" type="button">Add to Cart</button>
        `;

        const addBtn = card.querySelector('.add-btn');
        addBtn.addEventListener('click', () => {
          cartCount += 1;
          document.getElementById('cartBtn').textContent = 'Cart (' + cartCount + ')';
        });

        const minusBtn = card.querySelector('[data-action="minus"]');
        const plusBtn = card.querySelector('[data-action="plus"]');
        const qtyText = card.querySelector('.qty-box span');
        let currentQty = 1;

        minusBtn.addEventListener('click', () => {
          currentQty = Math.max(1, currentQty - 1);
          qtyText.textContent = currentQty;
        });

        plusBtn.addEventListener('click', () => {
          currentQty += 1;
          qtyText.textContent = currentQty;
        });

        return card;
      }

      const grid = document.getElementById('productGrid');
      products.forEach(product => {
        grid.appendChild(createProductCard(product));
      });
    </script>
  </body>
</html>
